<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Unit Tests - 6 Cases</title>
        <link rel="stylesheet" href="https://code.jquery.com/qunit/qunit-2.20.1.css">
    </head>
    <body>
        <div id="qunit"></div>
        <div id="qunit-fixture">
            <table id="results"></table>
            <input type="text" id="searchInput">
            <div id="reviewFormBody">
                <select id="locationSelect"><option value="Test">Test</option></select>
                <textarea id="reviewText">Review</textarea>
            </div>
            <div id="successMessage" style="display:none;">Success</div>
        </div>

        <script src="https://code.jquery.com/qunit/qunit-2.20.1.js"></script>
        <script src="../script.js"></script>

        <script>
            

            QUnit.module('Test Suite', function() {

                // TEST 1 - FR1 - Search Matching
                QUnit.test('TC1.1 & TC1.2: Search results display', function(assert) {
                    outputTable({ features: [{ attributes: { NAME: "Ducie", TYPE_DESCRIPTION: "On-Street" } }] });
                    let table = document.getElementById("results");
                    assert.equal(table.children.length, 1, "Displays matching results");
                    
                    outputTable({ features: [] });
                    assert.ok(table.innerHTML.includes("No results found"), "Handles empty search");
                });

                // TEST 2 - FR2 - Dataset Loading
                QUnit.test('TC2.1 & TC2.2: Dataset loading states', function(assert) {
                    outputTable({ features: [{ attributes: { NAME: "Nearest", TYPE_DESCRIPTION: "Park" } }] });
                    assert.ok(document.getElementById("results").innerHTML.includes("Nearest"), "Displays data when loaded");
                    
                    outputTable({ features: [] });
                    assert.ok(document.getElementById("results").innerHTML.includes("No results found"), "Handles load failure");
                });

                // TEST 3 - FR3 - Map Marker Data
                QUnit.test('TC3.1 & TC3.2: Map data availability', function(assert) {
                    outputTable({ features: [{ attributes: { NAME: "CCTV", TYPE_DESCRIPTION: "Safety" } }] });
                    assert.ok(document.getElementById("results").innerHTML.includes("CCTV"), "Displays available facilities");
                    
                    outputTable({ features: null });
                    assert.ok(document.getElementById("results").innerHTML.includes("No results found"), "Handles null data safely");
                });

                // TEST 4 - NFR1 - Space Availability & Reviews
                QUnit.test('TC4.1 & TC4.2: Review submission feedback', function(assert) {
                    document.getElementById("locationSelect").value = "Test";
                    document.getElementById("reviewText").value = "Valid";
                    submitReview();
                    
                    assert.equal(document.getElementById("reviewFormBody").style.display, "none", "Form hides on submit");
                    assert.equal(document.getElementById("successMessage").style.display, "block", "Success message appears");
                });

                // TEST 5 - NFR2 - Safety Data Display
                QUnit.test('TC5.1 & TC5.2: Safety data (CCTV) logic', function(assert) {
                    outputTable({ features: [{ attributes: { NAME: "Safe", TYPE_DESCRIPTION: "CCTV: YES" } }] });
                    assert.ok(document.getElementById("results").innerHTML.includes("CCTV: YES"), "Shows CCTV: YES");

                    outputTable({ features: [{ attributes: { NAME: "Unsafe", TYPE_DESCRIPTION: "CCTV: NO" } }] });
                    assert.ok(document.getElementById("results").innerHTML.includes("CCTV: NO"), "Shows CCTV: NO when missing");
                });

                // TEST 6 - NFR3 - Feedback & Responsiveness
                QUnit.test('TC6.1 & TC6.2: UI feedback and mobile responsiveness', function(assert) {
                    let searchInput = document.getElementById("searchInput");
                    searchInput.value = "Test Term";
                    assert.equal(searchInput.value, "Test Term", "Input accepts data without lag");

                    let msg = document.getElementById("successMessage");
                    msg.style.display = "block";
                    assert.equal(msg.style.display, "block", "UI provides immediate visual response");
                });

            });
        </script>
    </body>
</html>
