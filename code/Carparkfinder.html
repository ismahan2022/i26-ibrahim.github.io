<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Car Park Finder - Smart Search</title>
        <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
        <link rel="stylesheet" href="style.css" />
    </head>
    <body class="w3-light-grey">

        <header class="main-header w3-white">
            <h1 class="logo">Car Park Finder</h1>
            <div class="header-search">
                <input type="text" placeholder="Quick search..." class="w3-border w3-round" style="padding:8px; width:200px;"/>
                <button class="w3-button w3-blue w3-round">Search</button>
            </div>
        </header>

        <nav class="topnav">
            <a href="index.html">Home</a>
            <a href="map.html">Map</a>
            <a href="Carparkfinder.html" class="active">CarParkFinder</a>
            <a href="Reviews.html">Reviews</a>
            <a href="CurrentIssues.html">Current Issues</a>
        </nav>

        <main class="dashboard">
            <div class="w3-container w3-white w3-card w3-round w3-padding-24">
                <h2 class="w3-margin-0">Search Car Parks</h2>
                <p class="w3-text-grey">Filter by location name or parking type.</p>
                <hr>

                <div class="w3-row w3-margin-top">
                    <div class="w3-col s12 m8">
                        <input type="text" id="searchInput" class="w3-input w3-border w3-round" placeholder="Enter location name">
                    </div>
                    <div class="w3-col s12 m4 w3-padding-small">
                        <button class="w3-button w3-blue w3-round w3-block" onclick="search()">Search</button>
                    </div>
                </div>

                <div class="w3-center w3-padding-16">
                    <button class="w3-button w3-black w3-round-xxlarge w3-small w3-margin-bottom" onclick="query()">Show All</button>
                    <button class="w3-button w3-black w3-round-xxlarge w3-small w3-margin-bottom" onclick="filter('Free')">Free</button>
                    <button class="w3-button w3-black w3-round-xxlarge w3-small w3-margin-bottom" onclick="filter('Pay and Display')">Pay & Display</button>
                    <button class="w3-button w3-black w3-round-xxlarge w3-small w3-margin-bottom" onclick="filter('Pay on Foot')">Pay on Foot</button>
                    <button class="w3-button w3-black w3-round-xxlarge w3-small w3-margin-bottom" onclick="filter('Parking Meters')">Meters</button>
                    <button class="w3-button w3-black w3-round-xxlarge w3-small w3-margin-bottom" onclick="filter('Permit Holders Only')">Permits</button>
                    <button class="w3-button w3-black w3-round-xxlarge w3-small w3-margin-bottom" onclick="filter('Reserved Only')">Reserved</button>
                    <button class="w3-button w3-black w3-round-xxlarge w3-small w3-margin-bottom" onclick="filter('Unlimited use')">Unlimited</button>
                </div>

                <div class="w3-responsive w3-margin-top">
                    <table class="w3-table-all w3-hoverable">
                        <thead>
                            <tr class="w3-blue">
                                <th>Name</th>
                                <th>Type</th>
                            </tr>
                        </thead>
                        <tbody id="results">
                            </tbody>
                    </table>
                </div>
            </div>
        </main>

        <footer class="w3-container w3-center w3-padding-16">
            <p class="w3-text-grey w3-small">Bristol City Council Data &copy; 2026</p>
        </footer>
        <script>
            function outputTable(json) {
                let element = document.getElementById("results");
                element.innerHTML = "";
                
                if (!json.features || json.features.length === 0) {
                    element.innerHTML = "<tr><td colspan='2' class='w3-center'>No results found</td></tr>";
                    return;
                }

                json.features.forEach(f => {
                    let a = f.attributes;
                    let row = `<tr><td>${a.NAME}</td><td>${a.TYPE_DESCRIPTION}</td></tr>`;
                    element.innerHTML += row;
                });
            }

            function query() {
                let url = "https://maps2.bristol.gov.uk/server2/rest/services/ext/ll_transport/MapServer/5/query?where=1%3D1&outFields=NAME,TYPE_DESCRIPTION&f=json";
                fetch(url).then(r => r.json()).then(outputTable);
            }

            function filter(type) {
                let encodedType = encodeURIComponent(type);
                let url = `https://maps2.bristol.gov.uk/server2/rest/services/ext/ll_transport/MapServer/5/query?where=TYPE_DESCRIPTION='${encodedType}'&outFields=NAME,TYPE_DESCRIPTION&f=json`;
                fetch(url).then(r => r.json()).then(outputTable);
            }

            function search() {
                let term = document.getElementById("searchInput").value;
                let encodedTerm = encodeURIComponent(term.toUpperCase());
                let url = `https://maps2.bristol.gov.uk/server2/rest/services/ext/ll_transport/MapServer/5/query?where=UPPER(NAME) LIKE '%${encodedTerm}%'&outFields=NAME,TYPE_DESCRIPTION&f=json`;
                fetch(url).then(r => r.json()).then(outputTable);
            }

            window.onload = query;
        </script>
    </body>
</html>
